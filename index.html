function tone(freq,when,dur,vol,type='sine'){
  if(!AC||!bgmOn) return;
  const o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
  o.type=type; o.frequency.setValueAtTime(freq,when);
  f.type='lowpass'; f.frequency.value=950;
  g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(vol,when+.18);
  g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(f).connect(g).connect(master); o.start(when); o.stop(when+dur+.1);
}
function tickMusic(){
  if(!AC||!bgmOn) return;
  const now=AC.currentTime+.04;
  // D minor / suspended, intentionally sparse and unresolved.
  const chords=[
    [146.83,220.00,293.66],
    [130.81,196.00,261.63],
    [116.54,174.61,233.08],
    [130.81,196.00,293.66]
  ];
  const c=chords[step%chords.length];
  c.forEach((f,i)=>tone(f,now,5.8,i===0?.032:.018,'sine'));
  if(step%2===1) tone(c[1]*2,now+.72,2.4,.012,'triangle');
  step++;
}
function toggleBGM(){
  bgmOn=!bgmOn;
  document.getElementById('bgmToggle').textContent='BGM：'+(bgmOn?'ON':'OFF');
  if(AC){ master.gain.cancelScheduledValues(AC.currentTime); master.gain.linearRampToValueAtTime(bgmOn?.11:0,AC.currentTime+.25); }
  if(bgmOn&&!musicStarted) initBGM();
}

const V=document.getElementById('visual'),P=document.getElementById('place'),G=document.getElementById('goal'),
T=document.getElementById('text'),W=document.getElementById('who'),O=document.getElementById('opts'),C=document.getElementById('cover');
let f={},no=0;
function scene(i,p,g){V.style.backgroundImage=`url("${imgs[i]}")`;P.textContent=p;G.textContent=g}
function say(w,t,ops=[]){W.textContent=w;T.textContent=t;O.innerHTML='';ops.forEach(x=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=x[1];O.appendChild(b)})}
function start(){initBGM();if(AC&&AC.state==='suspended')AC.resume();C.style.display='none';store()}
function store(){scene(1,'便利店外 / 00:00','调查便利店外');say('系统','2026.10.09 / 00:00\n\n雨刚停。便利店已经关门。\n自动贩卖机的出货口里，好像卡着什么。',[['调查自动贩卖机',can],['查看地上的小票',receipt],['查看玻璃门',glass]])}
function can(){scene(2,'自动贩卖机','线索 1 / 3');f.a=1;say('调查','一罐已经喝空的汽水。\n罐底被红笔圈出了四位数字：\n\n1009',[['记住 1009',check]])}
function receipt(){scene(3,'褪色小票','线索 2 / 3');f.b=1;say('调查','日期：2026.10.09\n时间：00:00\n\n背面只有一句话：\n“25号存档，等待写入。”',[['收好小票',check]])}
function glass(){scene(4,'玻璃门','线索 3 / 3');f.c=1;say('调查','玻璃门上贴着一张已经褪色的纸。\n\n2001 → 2026\n1009',[['记住',check]])}
function check(){if(f.a&&f.b&&f.c){scene(5,'便利店内','线索已连接');say('系统','1009 / 2001 → 2026 / AGE 24\n\n便利店深处传来短促的电子音。\n收银台后面，有一扇通往公寓楼梯的门。',[['进入楼梯间',stairs]])}else store()}
function stairs(){scene(6,'公寓楼梯','恢复旧存档');say('系统','楼梯间很安静。\n感应灯只亮了一半。\n第三层的台阶上放着一部旧手机。',[['拿起旧手机',phone],['查看墙上的数字',wall]])}
function wall(){say('调查','墙上反复写着“25”。\n更旧的一层油漆下面，还能看见“24”。',[['返回',stairs]])}
function phone(){scene(7,'旧手机','需要四位密码');say('旧手机','请输入四位密码。\n提示：生日。',[['输入 1009',unlock],['输入 2001',wrong]])}
function wrong(){say('旧手机','密码错误。',[['重新输入',phone]])}
function unlock(){scene(7,'旧手机 / 已解锁','读取未发送消息');say('旧手机','解锁成功。\n\n里面没有联系人。\n只有一条很久以前写好，却从未发送的消息：\n\n“以后也一起麻烦下去吧。”',[['读取记忆碎片',mem1]])}
function mem1(){scene(8,'记忆碎片 01','恢复中');say('记忆','那些争论到谁也不服谁的晚上。\n那些嘴上说“随便”，其实一个字都没少听的时候。',[['下一段',mem2]])}
function mem2(){scene(8,'记忆碎片 02','恢复中');say('记忆','还有一些情绪怎么都过不去的夜晚。\n\n没有解决。没有大道理。\n只是有人一直没有走。',[['继续',verify]])}
function verify(){scene(9,'最后的门','最终验证');say('系统','这个存档为什么一直没有被删除？',[['因为忘记删了',bad],['因为任务还没完成',bad],['因为有人一直没有离开',door]])}
function bad(){say('系统','验证失败。\n这个答案太像游戏了。',[['重新回答',verify]])}
function door(){scene(9,'25号房','已解锁');say('系统','验证通过。\n\nROOM 25 / UNLOCKED',[['推开门',room]])}
function room(){scene(10,'ROOM 25','生日存档');say('系统','房间里没有人。\n桌上只有一个蛋糕，蜡烛是“2”和“5”。\n旁边的终端正在等待最后一次确认。',[['查看桌上的纸条',note],['打开存档终端',save]])}
function note(){scene(11,'留给25岁的纸条','生日存档');say('纸条','25岁也没关系。\n\n更自由一点。更快乐一点。少内耗一点。\n多做真正喜欢的事。\n\n不需要一下子变成更好的人。',[['打开存档终端',save]])}
function save(){scene(12,'新的开始','24 → 25');say('存档终端','年龄更新\n\n24 → 25\n\n是否写入新存档？',[['是',yes],['不',nope]])}
function nope(){no++;let a=['拒绝无效。','别点了。','你25了，认命吧。','“不”选项已经损坏。'];say('存档终端','24 → 25\n\n'+a[Math.min(no-1,3)],no<4?[['是',yes],['不',nope]]:[['是',yes]])}
function yes(){scene(13,'HAPPY BIRTHDAY','写入完成');say('系统','SAVE DATA UPDATED.\n\n新存档创建成功。',[['读取新存档',ending]])}
function ending(){scene(14,'25.exe','生日快乐');say('给25岁的你','生日快乐。\n\n你继续讲你的道理，继续嘴贱，继续做那个很难被说服的人。\n\n也希望新的一岁，你可以更自由一点，更快乐一点。\n那些没必要困住你的东西，就让它们留在24岁的旧存档里。\n\n谢谢你在很多时候都没有走。\n以后也一起，麻烦下去吧。',[['继续一起活到下一个存档点',secret]])}
function secret(){scene(15,'隐藏结局','未完待续');say('系统消息','新的存档，从今天开始。\n\nPLAYER：ONLINE\nNEXT SAVE POINT：UNKNOWN\nSAVE FILE：未完待续\n\n25岁生日快乐。',[['重新开始',()=>location.reload()]])}
say('系统','等待读取……');
</script></body></html>
